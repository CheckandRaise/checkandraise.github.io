<header class="site-header" role="banner">
  <div class="wrapper">
    {% if page.lang == "zh-CN" %}
      {% assign home_url = "/zh/" %}
    {% else %}
      {% assign home_url = "/" %}
    {% endif %}

    <a class="site-title" rel="author" href="{{ home_url | relative_url }}">{{ site.title | escape }}</a>

    <nav class="site-nav" aria-label="{% if page.lang == 'zh-CN' %}主导航{% else %}Primary navigation{% endif %}">
      <input type="checkbox" id="nav-trigger" class="nav-trigger">
      <label for="nav-trigger">
        <span class="menu-icon">
          <svg viewBox="0 0 18 15" width="18px" height="15px" aria-hidden="true">
            <path d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484S0.665,0,1.484,0h15.031C17.335,0,18,0.665,18,1.484z M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516s0.665-1.484,1.484-1.484h15.031C17.335,6.031,18,6.696,18,7.516z M18,13.516C18,14.335,17.335,15,16.516,15H1.484C0.665,15,0,14.335,0,13.516s0.665-1.484,1.484-1.484h15.031C17.335,12.031,18,12.696,18,13.516z"></path>
          </svg>
        </span>
        <span class="sr-only">{% if page.lang == "zh-CN" %}展开导航{% else %}Open navigation{% endif %}</span>
      </label>

      <div class="trigger">
        {% if page.lang == "zh-CN" %}
          <a class="page-link{% if page.url == '/zh/' %} page-link-current{% endif %}" href="{{ '/zh/' | relative_url }}">首页</a>
          <a class="page-link{% if page.url == '/zh/research/' %} page-link-current{% endif %}" href="{{ '/zh/research/' | relative_url }}">研究</a>
          <a class="page-link{% if page.url == '/zh/cv/' %} page-link-current{% endif %}" href="{{ '/zh/cv/' | relative_url }}">简历</a>
          <a class="page-link{% if page.url == '/zh/photography/' %} page-link-current{% endif %}" href="{{ '/zh/photography/' | relative_url }}">摄影</a>
          <a class="page-link{% if page.url == '/zh/miscellaneous/' %} page-link-current{% endif %}" href="{{ '/zh/miscellaneous/' | relative_url }}">生活</a>
          <a class="page-link language-switch" href="{{ page.alternate_url | default: '/' | relative_url }}" lang="en" hreflang="en" aria-label="View this page in English">EN</a>
        {% else %}
          <a class="page-link{% if page.url == '/' %} page-link-current{% endif %}" href="{{ '/' | relative_url }}">Home</a>
          <a class="page-link{% if page.url == '/research/' %} page-link-current{% endif %}" href="{{ '/research/' | relative_url }}">Research</a>
          <a class="page-link{% if page.url == '/cv/' %} page-link-current{% endif %}" href="{{ '/cv/' | relative_url }}">CV</a>
          <a class="page-link{% if page.url == '/photography/' %} page-link-current{% endif %}" href="{{ '/photography/' | relative_url }}">Photography</a>
          <a class="page-link{% if page.url == '/miscellaneous/' %} page-link-current{% endif %}" href="{{ '/miscellaneous/' | relative_url }}">Miscellaneous</a>
          <a class="page-link language-switch" href="{{ page.alternate_url | default: '/zh/' | relative_url }}" lang="zh-CN" hreflang="zh-CN" aria-label="查看本页中文版">中文</a>
        {% endif %}
      </div>
    </nav>
  </div>
</header>
